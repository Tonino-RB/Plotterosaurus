[pytest]
testpaths = tests
markers =
    # Tests that run against whatever real drawings are sitting in tests/real/.
    # They are the slow lane — vpype reads an 8MB document in about fifteen
    # seconds and these ask it to several times — so the everyday loop is:
    #     venv/bin/python -m pytest -m "not real" -q
    real: runs against the real drawings in tests/real/ (minutes, not seconds)
