<!-- Square to within unit-conversion rounding (0.02mm over 200mm).
     Sets the scale of the A9 tolerance. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="200.02mm" height="200mm" viewBox="0 0 200.02 200">
  <g inkscape:groupmode="layer" inkscape:label="art">
    <circle cx="100" cy="100" r="80" fill="none" stroke="#000"/>
  </g>
</svg>
